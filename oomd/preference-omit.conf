# Deployed as 10-batesste-oomd.conf into the .d directory of every
# unit listed in OMIT_UNITS in deploy.sh.
#
# ManagedOOMPreference=omit removes a cgroup from consideration
# entirely -- oomd will never select it, no matter how much swap or
# memory it holds. Reserved for the two units whose death turns a
# recoverable incident into a drive-to-the-node incident.
#
# ssh.service and tailscaled.service are on this list for a specific
# reason. The 16 September failure ended with a power cycle *because
# there was no way in*: SSH could not be scheduled, the tailnet
# address stopped answering, and the only remaining control surface
# was the power button. An OOM policy that can kill the last remote
# shell has optimised for the wrong outcome. Whatever else is
# happening on this box, it should still be possible to log in and
# look at it.
#
# Keep this list at two. Every unit marked omit is a unit that can
# grow without bound and shifts the kill onto something else; the
# protection is only meaningful while it is scarce.

[Service]
ManagedOOMPreference=omit
