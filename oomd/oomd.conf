# /etc/systemd/oomd.conf.d/10-batesste.conf
#
# A drop-in rather than an edit to /etc/systemd/oomd.conf, so a
# systemd package upgrade cannot quietly revert these and leave the
# node back in the state that produced the 16 September 2026 hang.
#
# Why this exists at all: snoc-beelink has 7.5 GiB of RAM and a 4 GiB
# swap file, and on 16 September it spent 45 minutes in a swap-thrash
# livelock -- kernel alive and still logging, userspace unschedulable,
# recovered only by a power cycle. The kernel OOM killer never fired
# once. That is the normal outcome, not a bug: with enough swap,
# MemAvailable never reaches the floor that triggers oom-kill, so the
# kernel reclaims and re-faults forever instead of killing anything.
# Swap converts "one process dies" into "the whole node hangs", and
# systemd-oomd exists to make the first thing happen instead.

[OOM]

# Kill when swap is 90% consumed. Backtested against the hang: swap
# crossed 90% used at roughly 01:00 on 16 September, which is 5.5
# hours before userspace stopped responding and 6.5 hours before the
# power cycle. There was plenty of time, nothing was watching.
#
# Deliberately left at the upstream default rather than tightened.
# Killing is destructive and irreversible, so the backstop should be
# late and certain; the early warning is the Grafana alert's job
# (grafana/provisioning/alerting/rules.yaml fires NodeSwapFillingUp
# at 50% swap free, which in the same backtest would have notified at
# 18:00 on the 15th -- 13 hours out). Alert early to a human, kill
# late as a machine.
SwapUsedLimit=90%

# How long memory pressure must stay above a cgroup's limit before
# oomd acts. 20s rather than the 30s default: the whole failure mode
# here is a node that degrades faster than a human can react, and the
# pressure rule is already the conservative of the two triggers
# because it only ever applies to user@.service.
DefaultMemoryPressureDurationSec=20s
