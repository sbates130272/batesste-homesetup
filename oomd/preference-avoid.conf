# Deployed as 10-batesste-oomd.conf into the .d directory of every
# unit listed in AVOID_UNITS in deploy.sh.
#
# ManagedOOMPreference=avoid deprioritises a cgroup: oomd considers it
# only once every candidate without the preference has been exhausted.
# Unlike omit it is not a guarantee, which is the right strength for
# everything here -- these services should survive a routine kill, but
# none of them is worth losing the node for.
#
# The monitoring stack (prometheus, grafana-server, loki, alloy) is on
# this list because of how the 16 September incident actually read
# afterwards. Prometheus scrapes stop at 06:30, journald hit its
# watchdog at 06:34:54, and the last userspace log line is 06:35:56 --
# so the record of the most interesting 45 minutes is the 45 minutes
# with no record. An OOM policy that kills the observability first
# reproduces that blind spot deliberately, every time it fires.
# Whatever oomd does, there should be a graph of it afterwards.
#
# hermes-gateway is here rather than in omit because it is both the
# thing this node exists to run and a plausible memory hog: it is the
# long-lived parent of the kanban dispatcher, and it lives inside
# user@1000.service where the pressure rule applies. avoid means the
# transient worker scopes and the editor processes around it are taken
# first, which is almost always the correct kill -- but if the gateway
# itself is the leak, it stays reachable as a last resort.
#
# Note hermes-gateway.service is a *user* unit, so its drop-in goes in
# ~/.config/systemd/user/ and not /etc/systemd/system/. deploy.sh
# handles the two cases separately; see USER_AVOID_UNITS.

[Service]
ManagedOOMPreference=avoid
