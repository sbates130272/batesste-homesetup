# /etc/systemd/system/-.slice.d/90-batesste-oomd.conf
#
# systemd-oomd monitors nothing by default. It only considers cgroups
# that have explicitly opted in via ManagedOOMSwap= or
# ManagedOOMMemoryPressure=, which is why installing the package on
# its own changes no behaviour whatsoever -- a detail worth knowing
# before concluding the node is protected.
#
# This is the opt-in for the swap trigger, at the root of the
# hierarchy so every cgroup on the box is in scope. When system-wide
# swap use exceeds SwapUsedLimit (see oomd.conf), oomd walks the
# descendants of this slice and kills the cgroup with the largest swap
# footprint, honouring the omit/avoid preferences set in
# preference-omit.conf and preference-avoid.conf.
#
# Ubuntu does NOT enable this for you. Its systemd-oomd package ships
# /usr/lib/systemd/system/-.slice.d/10-oomd-root-slice-defaults.conf
# containing `ManagedOOMSwap=auto` -- the trigger switched off. On
# stock Ubuntu the swap half of oomd does nothing at all, which is
# worth knowing before assuming `apt install systemd-oomd` bought any
# protection.
#
# Hence the 90- prefix on the deployed filename. systemd merges
# drop-ins in filename order across all search directories, and /etc
# only beats /usr/lib when the filenames match. At 10- this file
# sorted before the distro's and lost to it silently: `systemctl show
# -p ManagedOOMSwap -- -.slice` read `auto` and oomctl listed no
# swap-monitored cgroups, while everything else looked healthy.

[Slice]
ManagedOOMSwap=kill
