# /etc/systemd/system/user@.service.d/90-batesste-oomd.conf
#
# Ubuntu's 10-oomd-user-service-defaults.conf sets exactly these two
# values, so unlike the root slice this one appears to work at any
# filename -- the effective policy is simply the distro's, and an
# upgrade that retuned it would move this host with it and leave no
# trace in this repo. The 90- prefix makes ours the one that applies.
#
# The second trigger: memory pressure inside a logged-in user's
# manager. Where the swap rule catches the slow bleed, this catches
# the case where RAM is exhausted fast enough that swap never fills --
# a build, a runaway worker, a browser tab.
#
# user@.service is the right place to point it on this host because
# that is where the memory actually is. At the time of writing
# user-1000.slice holds ~2.8 GiB of the 7.5 GiB total: the VS Code
# Remote server and its extension hosts, the Claude Code binary, and
# Hermes itself -- hermes-gateway and hermes-dashboard are *user*
# units, living in user@1000.service/app.slice, not system.slice.
#
# Which is also the uncomfortable part, and worth being explicit
# about: this rule can kill a Hermes worker scope or a VS Code
# session. That is the intended behaviour. The alternative is the
# behaviour we already have evidence for, where nothing is killed and
# the node is lost entirely. hermes-gateway carries
# ManagedOOMPreference=avoid (see preference-avoid.conf) so the
# long-lived agent is the last thing in the slice to be considered,
# well after the transient workers and editor processes.
#
# 50% matches Ubuntu's shipped default. oomd kills a descendant of the
# monitored cgroup -- not the whole user manager -- selecting by
# memory usage among the candidates that have not opted out.

[Service]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
