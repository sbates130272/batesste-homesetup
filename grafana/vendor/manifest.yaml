  - uid: lemonade-built-in-metrics
    title: Lemonade Metrics Dashboard
    file: dashboards/general/lemonade-built-in-metrics.json
    folder: General
    upstream: https://grafana.com/grafana/dashboards/25422-lemonade-built-in-metrics/
    upstream_confidence: probable
    upstream_metrics: https://github.com/lemonade-sdk/lemonade
    retrieved: 2026-09-03
    created: 2026-06-05
    notes: >-
      grafana.com 25422. Its slug is our uid verbatim, it carries the
      `built-in-metrics` tag, and it has the DS_PROMETHEUS variable that
      only the grafana.com publishing flow requires. Marked probable
      rather than confirmed because this host cannot reach grafana.com to
      diff the JSON, and because our title reads "Lemonade Metrics
      Dashboard" against the listing's "Lemonade Built-in Metrics" --
      either a local rename or a listing/JSON mismatch, unresolved.

      Note it is not in the lemonade-sdk/lemonade repo: that ships no
      Grafana JSON at all. `upstream_metrics` records where the metric
      *contract* lives instead (src/cpp/server/prometheus_metrics.cpp),
      which is what a query has to stay valid against.

      ${DS_PROMETHEUS} is bound here to snoc-beelink-prometheus -- a real
      template variable, unlike the NVMe dashboard above where the same
      name was left as an unresolved import input.

      Checked 2026-09-03 against the 44 lemonade_* series live in
      Prometheus: 22 of its 25 metric names resolve. Two panels are dead,
      both querying a lemonade_model_decode_token_time_* family that
      lemonade no longer exports -- "Streaming Decode Token Timing" and
      "Streaming Decode Token Samples". Re-fetching 25422 may well fix
      those, since upstream tracks lemonade's renames.

      Checked 2026-09-03 against the 44 lemonade_* series live in
