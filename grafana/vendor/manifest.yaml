  - uid: ae0aj8euc43r4b
    title: AMD GPU (device-metrics-exporter)
    file: dashboards/amd-related/amd-device-metrics-gpu.json
    folder: AMD Related
    upstream: https://github.com/ROCm/device-metrics-exporter/blob/v1.5.1/grafana/dashboard_gpu.json
    upstream_ref: v1.5.1
    upstream_metrics: https://github.com/ROCm/device-metrics-exporter
    retrieved: 2026-09-06
    created: 2026-09-06
    notes: >-
      Pinned to v1.5.1 because that is exactly what snoc-strix runs:
      amdgpu-exporter 1.5.1-3~24.04, reporting v1.5.1-3 / GitCommit
      66196fa73. Refresh by moving the tag when the package moves, not
      from main. snoc-beelink has no egress to GitHub, so fetch through
      snoc-strix:

        ssh snoc-strix 'curl -sS https://raw.githubusercontent.com/\
        ROCm/device-metrics-exporter/v1.5.1/grafana/dashboard_gpu.json'

      Seven local edits. The first two are adoption boilerplate and a
      re-fetch must redo them; the last five are real divergence and a
      re-fetch would revert them:

        (a) Dropped the __inputs / __elements / __requires import
            wrapper and bound the 60 ${DS_PROMETHEUS} references to
            ae8pyuqoyonpca plus the 3 ${DS_EXPRESSION} ones to
            __expr__. Provisioning cannot answer import prompts --
            skipping this is exactly how the NVMe dashboard ended up
            pointing at a datasource uid that does not exist here.

        (b) g_metrics_prefix defaulted to "amd_" (current, options and
            query). This is a supported upstream knob, not a hack: its
            own description reads "string to prefix names of metrics
            queries (e.g. gpu_gfx_activity -> amd_gpu_gfx_activity)".

        (c) Every gpu_gfx_busy_instantaneous selector gained an
            `or ${g_metrics_prefix}gpu_gfx_activity{...}` fallback with
            a byte-identical label selector -- 3 sites here (GPU Usage
            B and C, GPU Compute Core Usage A). See the card_model note
            below. On CDNA the first operand still wins, so upstream
            behaviour is unchanged.

        (d) The GPU Power Usage gauge queried
            {"${g_metrics_prefix}gpu_average_package_power", hostname=...},
            a quoted metric name inside the selector. That is the
            Prometheus 3.0 UTF-8 name syntax and this server runs
            2.45.3, which rejects it outright -- the panel showed a
            parse error, not empty data. Rewritten to the classic
            ${g_metrics_prefix}gpu_average_package_power{hostname=...}
            form, which is semantically identical and parses on both.

        (e) Retitled from "GPU", too generic for a folder shared with
            HSA Snoop and Lemonade Metrics Dashboard.

        (f) Retagged from ["version: main"], which was untrue the
            moment we pinned to v1.5.1.

        (h) g_metrics_prefix and g_cluster_name set to hide: 2 in both
            files -- 2026-09-08. Lettered (h) because (g) was already
            taken by an Overview-only edit; this one applies to both.
            Both pickers were inert but occupied the top bar. The
            prefix is fixed at "amd_" by edit (b) and there is no
            second value to choose: prometheus.yml rewrites every
            __name__ to that prefix on ingest, so it is an invariant
            of the TSDB rather than a per-host property. Cluster has
            exactly one option, "amdgpu-k8s-metrics-exporter", which
            is the exporter's packaged default string and not the name
            of any cluster.

            HIDDEN, NOT REMOVED, and the reason is not just the ~118
            query references that would have to be rewritten.
            g_cluster_name is load-bearing despite being meaningless:
            g_hostname queries
            label_values({cluster_name="$g_cluster_name"},hostname).
            This Prometheus is a remote-write sink carrying AMD
            datacenter GPUs, and those series carry no cluster_name at
            all -- so that selector is the only thing keeping nine
            MI350-class hostnames out of a homelab GPU picker.
            Deleting the variable would widen the picker to the
            datacenter; hiding it keeps the filter and drops the noise.

      MetricsFieldPrefix: "amd_" is the exporter's *pristine* packaged
      default -- /etc/metrics/config.json on snoc-strix has the md5
      dpkg recorded, and upstream's own example/config.json sets the
      same value at this tag. Yet upstream's dashboards default
      g_metrics_prefix to "" and query bare gpu_*, so they do not work
      against their own exporter out of the box. One panel in this file
      even hardcodes amd_gpu_gfx_activity, which reads like a
      half-finished fix. Keep (b) across upgrades.

      The card_model regexes are a CDNA board-SKU allowlist. Panels
      branch on card_model=~"102-D65208-0C|102-D67305-00|102-D65209-0C"
      (and a longer MI-series list elsewhere), sending anything that
      does not match into a !~ branch that queries
      gpu_gfx_busy_instantaneous. Our card_model is "AMD Radeon 8060S
      Graphics", so it always lands in that branch -- and amdsmi does
      not supply gfx_busy_instantaneous on gfx1151. The result was
      empty GPU-usage panels while amd_gpu_gfx_activity sat right there
      populated. That is what (c) fixes.

      EIGHT PANELS ARE DEAD ON gfx1151 AND MUST NOT BE "FIXED": PCIe
      Max Speed, PCIe Counts, both PCIe Bandwidth panels, Energy
      Consumed, GPU Temperature, Memory Temperature and Temperature
      Sensors. amdsmi supplies no amd_pcie_*, no amd_gpu_*_temperature
      and no amd_gpu_energy_consumed on Strix Halo -- the families are
      absent from /metrics entirely, despite GPUConfig.Fields asking
      for them. These are not dead for the fleet: snoc-thinkstation's
      Navi 48 will populate them when that host returns. Repointing
      them at something that resolves today would break them for the
      only card that can answer, the same trap the hsa-snoop entry
      above describes.

      Verified 2026-09-06 against live Prometheus with the template
      variables substituted: 0 of 31 targets fail to parse and 13
      return data. The 18 empty ones are the CDNA =~ branches and the
      absent families above.

      `./sync-dashboards.sh --check` reports both AMD files as DRIFTED,
      and that is expected and permanent. Unlike the three entries
      around them, these were fetched from upstream rather than pulled
      out of Grafana, so they still carry upstream's byte layout. The
      whole diff is Grafana's normalisation on read: 16 threshold steps
      losing `"value": null` and schemaVersion 39 -> 42. **Do not run
      --pull to silence it.** That would replace these files with
      Grafana's rendering and make the next `git diff` against v1.5.2
      unreadable, which is the entire reason for pinning a tag.

