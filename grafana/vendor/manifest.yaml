  # ── Recovered from v2 storage ───────────────────────────────────
  # lemonade-built-in-metrics was stored in Grafana as a v2 dashboard
  # (elements/layout rather than panels), so it could only be captured in
  # the v1 schema this repo tracks by reading it back through the v1beta1
  # API. The file below is that rendering, not the stored bytes.

  - uid: lemonade-built-in-metrics
    title: Lemonade Metrics Dashboard
    file: dashboards/amd-related/lemonade-built-in-metrics.json
    folder: AMD Related
    upstream: https://grafana.com/grafana/dashboards/25422-lemonade-built-in-metrics/
    upstream_ref: revision 1
    upstream_metrics: https://github.com/lemonade-sdk/lemonade
    retrieved: 2026-09-03
    created: 2026-06-05
    notes: >-
      grafana.com 25422, confirmed by diffing revision 1: same uid, same
      19 panels, same panel titles, byte-identical queries, and the
      download carries `gnetId: 25422`. Our copy dropped that field
      because it was imported by pasting the JSON rather than by ID.

      Not in the lemonade-sdk/lemonade repo -- that ships no Grafana JSON
      at all, the dashboard is published only to grafana.com.
      `upstream_metrics` records where the metric *contract* lives
      (src/cpp/server/prometheus_metrics.cpp), which is what the queries
      have to stay valid against.

      We have diverged from revision 1 in three ways, all deliberate
      looking: the title was changed from "Lemonade Built-In Metrics" to
      "Lemonade Metrics Dashboard"; the layout was reworked, most visibly
      the three External AMD GPU panels widened from w=8 to w=12 and
      moved off their shared row, plus "Loaded Model Metadata" grown from
      h=7 to h=11; and a `min: 0` axis floor was added to two panels.
      Everything else in the 609-line raw diff is Grafana's schemaVersion
      39 -> 42 migration (threshold `"value": null` becoming 0, dropped
      empty `mappings`, materialised `annotations` and
      `percentChangeColorMode`), not a change anyone made.

      So a refresh is a merge, not an overwrite. Re-fetching would revert
      the relayout and the title.

      ${DS_PROMETHEUS} is bound here to snoc-beelink-prometheus -- a real
      template variable, unlike the NVMe dashboard above where the same
      name was left as an unresolved import input.

      Two panels were dead when this was adopted, both querying a
      lemonade_model_decode_token_time_* family that does not exist in
      Lemonade at all -- `decode_token_time` has no hits anywhere in
      lemonade-sdk/lemonade, and upstream revision 1 queries the same
      three names, so the breakage is upstream's and a refresh would not
      have fixed it. Repointed locally on 2026-09-03 to metrics Lemonade
      does export, preserving each panel's unit and stated meaning:

        Streaming Decode Token Timing
          was lemonade_model_decode_token_time_avg_seconds and
          _max_seconds; now 1 / lemonade_model_tokens_per_second, which
          is the mean decode interval in seconds. Lemonade exposes no
          maximum, so that series was dropped rather than approximated.

        Streaming Decode Token Samples
          was lemonade_model_decode_token_time_count; now
          lemonade_model_output_tokens, the token count of the latest
          streamed response -- which is precisely the number of per-token
          decode intervals it contained.

      All 25 metric names the dashboard references now resolve against
      live Prometheus. This divergence is intentional: do not let a
      refresh from 25422 revert it.

      The 2026-09-03 scrub added descriptions to the twelve panels that
      lacked them. Cosmetic, but it widens the diff against 25422 further.

