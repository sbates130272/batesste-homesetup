  - uid: gbGKmy-Gz
    title: Node Exporter Overview
    was: dashboards/home-network-related/node-exporter-overview.json
    deleted: 2026-09-08
    reason: >-
      First-party, one panel ("Node Exporter Summary"), superseded by LAN
      Overview. Nothing linked to the uid.

      It had 12 targets but only 8 columns: the organize transform set
      excludeByName on Load, TCP estab, TCP tw and Net sock, so those four
      queries ran on every refresh and were then thrown away. Of the 8 that
      rendered, CPU and Memory were already columns on LAN Overview's Node
      Fleet, and Filesystem was already the Filesystem Usage bargauge. That
      left Disk Reads, Disk Writes, Net Recv and Net Trans as the only
      genuine loss, and they are now the Node I/O table (panel 48).

      Two defects were fixed rather than carried over. Net Recv/Trans took
      an unfiltered max across every interface, which reported amd-laptop's
      loopback0 as its network throughput; the ported query filters to
      (en|eth|wl).*. And every rate is now gated on node_uname_info, without
      which snoc-shannon returns a row despite up=0.

      Also carried three pieces of dead configuration worth not resurrecting:
      overrides matched "Disk read"/"Disk write"/"Net recv" while
      renameByName produced "Disk Reads"/"Disk Writes"/"Net Recv", so those
      three never applied; a "Cores" rename for a Value #E no target
      produced; and a data link pointing at grafana.rcrtv.net, a host that
      is not ours.
