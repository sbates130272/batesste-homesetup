# Alert rules for the S3 disk backup, fed by the s3-backup-age
# node-exporter textfile collector in
# prometheus/textfile-collectors/.
#
# Four rules for four distinct failure modes, deliberately kept
# separate so each one names its own cause rather than firing a single
# vague "backup unhealthy":
#
#   BackupCheckFailing  the check itself cannot reach S3
#   BackupMissing       S3 is reachable and holds no backups at all
#   BackupStale         S3 holds backups and the newest one is old
#   BackupTooSmall      an object arrived on time but is implausible
#
# All four carry service=backup, which is what
# notification-policies.yaml routes on.
#
# Scoped to the disk backup only. The Hermes backup is disabled, its
# bucket does not exist, and a rule for it would fire from the moment
# it was deployed and stay firing indefinitely -- which is how an
# alert gets muted, and a muted alert is the state this whole exercise
# exists to get out of. Add it when the bucket exists and the timer is
# enabled.

apiVersion: 1

groups:
  - orgId: 1
    name: backups
    folder: Alerts
    # Evaluated far more often than a daily backup changes, because
    # the evaluation interval is also what bounds how long a NoData
    # condition takes to be noticed.
    interval: 5m
    rules:

      # ── Can we even check? ─────────────────────────────────────
      #
      # This rule owns every "the answer is unknown" case, which is
      # why it is the only one of the three with noDataState:
      # Alerting. query_success is written on every collector run
      # whatever the outcome, so its absence means the collector, the
      # node-exporter, or the host is gone -- and each of those hides
      # a backup just as effectively as a failed upload.
      #
      # This is the rule that would have caught the actual outage.
      # From June 2025 the key was rejected with InvalidAccessKeyId on
      # every single run, and nothing anywhere said so.
      - uid: batesste-backup-check-failing
        title: BackupCheckFailing
        condition: C
        for: 2h
        labels:
          service: backup
          severity: critical
        annotations:
          summary: >-
            Cannot verify the homelab disk backup: listing
            s3://batesste-homelab-backups failed, or the checker has
            stopped reporting. Backups may be silently failing.
          runbook: >-
            Check `journalctl -u s3-backup-age.service` on
            snoc-beelink. An InvalidAccessKeyId means the key in
            ~/.secrets.env needs rotating -- and remember the CI
            AWS_KEY/AWS_SECRET repository secrets are a separate
            store that has to be rotated with it.
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 10800
              to: 0
            datasourceUid: ae8pyuqoyonpca
            model:
              refId: A
              instant: true
              editorMode: code
              expr: batesste_s3_backup_query_success{bucket="batesste-homelab-backups"}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      # ── Are there any backups at all? ──────────────────────────
      #
      # Its own rule because an empty result is a successful query,
      # not a failed one: query_success stays 1, no timestamp series
      # is published, and BackupStale below therefore sees NoData and
      # resolves to OK. Without this rule, a bucket emptied by a
      # misfiring prune or pointed at the wrong name would be the one
      # state that alerts on nothing whatsoever.
      - uid: batesste-backup-missing
        title: BackupMissing
        condition: C
        for: 10m
        labels:
          service: backup
          severity: critical
        annotations:
          summary: >-
            s3://batesste-homelab-backups contains no backup objects
            for this host at all. The bucket is reachable and empty.
          runbook: >-
            Confirm the prefix still matches what batesste-s3-backup
            writes (hostname + BLK_DEVICE with slashes as dashes), and
            check PRUNE_DAYS/EXCEPT_DAY in batesste-s3-backup.conf
            before assuming data loss.
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 10800
              to: 0
            datasourceUid: ae8pyuqoyonpca
            model:
              refId: A
              instant: true
              editorMode: code
              expr: batesste_s3_backup_objects{bucket="batesste-homelab-backups"}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      # ── Is the newest backup recent? ───────────────────────────
      #
      # noDataState is OK rather than Alerting, and that is
      # intentional. Every no-data cause is already owned by
      # BackupCheckFailing above; repeating it here would mean two
      # notifications for one root cause, which is the fastest way to
      # teach yourself to ignore both.
      #
      # 48h, not 24h, so a single missed nightly run is not a page.
      # The timer runs at 01:00 daily and the run itself takes about
      # 40 minutes.
      - uid: batesste-backup-stale
        title: BackupStale
        condition: C
        for: 10m
        labels:
          service: backup
          severity: critical
        annotations:
          summary: >-
            No new homelab disk backup in over 48 hours. The newest
            object in s3://batesste-homelab-backups is older than two
            nightly runs.
          runbook: >-
            Check `systemctl status batesste-s3-backup.service` and
            `journalctl -u batesste-s3-backup.service` on
            snoc-beelink.
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 10800
              to: 0
            datasourceUid: ae8pyuqoyonpca
            model:
              refId: A
              instant: true
              editorMode: code
              expr: >-
                time() -
                batesste_s3_backup_last_object_timestamp_seconds{bucket="batesste-homelab-backups"}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [172800]

      # ── Is the newest backup plausible? ────────────────────────
      #
      # Age alone trusts the backup script further than it has earned.
      # batesste-s3-backup runs `dd | pigz > file` without
      # `set -o pipefail`, so only pigz's exit status reaches the
      # shell: a dd that dies a hundred megabytes in still produces a
      # complete, valid, tiny .gz, and the unit exits 0. A fresh
      # timestamp on a truncated image is the worst outcome available
      # here, because it is the one that looks healthy right up until
      # a restore is attempted.
      #
      # 5 GB against a historical range of 11.7-33.3 GB. Set well
      # below the smallest real backup on purpose -- this is a floor
      # for catching truncation, not a tripwire for normal growth.
      - uid: batesste-backup-too-small
        title: BackupTooSmall
        condition: C
        for: 10m
        labels:
          service: backup
          severity: warning
        annotations:
          summary: >-
            The newest homelab disk backup is under 5 GB, well below
            the 11.7-33.3 GB range of every previous backup. It may be
            a truncated dd that still compressed and uploaded cleanly.
          runbook: >-
            Compare against `aws s3 ls s3://batesste-homelab-backups`.
            If it is truncated, the run that produced it exited 0 --
            check the dd record counts in `journalctl -u
            batesste-s3-backup.service`.
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 10800
              to: 0
            datasourceUid: ae8pyuqoyonpca
            model:
              refId: A
              instant: true
              editorMode: code
              expr: batesste_s3_backup_last_object_bytes{bucket="batesste-homelab-backups"}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [5000000000]

  # ─────────────────────────────────────────────────────────────
  # Memory exhaustion
  # ─────────────────────────────────────────────────────────────
  #
  # Written after snoc-beelink hung on 16 September 2026. The node
  # spent 45 minutes in a swap-thrash livelock -- kernel alive and
  # still logging PCIe AER lines at widening intervals, userspace
  # unschedulable from 06:35:56, recovered only by a power cycle. The
  # kernel OOM killer never fired: with 4 GiB of swap, MemAvailable
  # never reaches the floor that triggers it, so the kernel reclaims
  # and re-faults indefinitely rather than killing anything.
  #
  # systemd-oomd is now the backstop (see oomd/ in this repo). These
  # rules are the other half, and the more important half: every
  # number below was already in Prometheus for the eighteen hours
  # before the hang, and no rule existed to read it. The failure was
  # not a lack of data.
  #
  # Three rules at three distances from the cliff, deliberately
  # separate so each one names its own stage rather than firing a
  # single vague "memory bad":
  #
  #   NodeSwapFillingUp   the slow bleed, hours out
  #   NodeMemoryCritical  headroom nearly gone, tens of minutes out
  #   NodeMemoryThrashing it is happening now
  #   NodeOOMKilled       something was killed; the backstop worked
  #
  # All carry service=memory, which notification-policies.yaml routes
  # on with a shorter repeat interval than the backup alerts get.
  #
  # Thresholds are ratios, not byte counts, so one rule covers a
  # 7.5 GiB beelink and a 125 GiB thinkstation without per-host
  # variants. Every one is backtested against the 15-16 September
  # series and against a 7-day fleet baseline; the lead times quoted
  # are measured, not estimated.
  #
  # Not covered here: a node that vanishes entirely. Every rule below
  # is noDataState: OK because a missing series means a missing
  # exporter, which is node-down alerting and a different rule that
  # this repo does not yet have. Do not fold it in -- an alert that
  # fires for two unrelated causes gets read as neither.
  - orgId: 1
    name: memory
    folder: Alerts
    # Tighter than the backup group's 5m. Memory exhaustion moves on a
    # timescale where a five-minute evaluation delay is a meaningful
    # fraction of the warning.
    interval: 1m
    rules:

      # ── The slow bleed ─────────────────────────────────────────
      #
      # Swap consumption is the earliest honest signal, because on a
      # box with swap it is what the leak eats first. The backtest is
      # unambiguous: swap was 100% free at 09:00 on the 15th, 31% free
      # by 18:00, 9% by 01:00 on the 16th and 0% from 03:00. Firing at
      # 50% free would have notified at 18:00 on the 15th -- thirteen
      # hours before the power cycle, with the node still completely
      # healthy and responsive.
      #
      # 1h of `for:` because swap filling is not in itself an
      # emergency and a build or a backup run can legitimately push
      # into swap for a while. Thirteen hours of margin can afford to
      # spend one confirming the trend is real.
      #
      # The `> 0` on SwapTotal is a filter, not a comparison: it drops
      # nodes with no swap from the result entirely rather than
      # dividing by zero and alerting on NaN forever.
      - uid: batesste-node-swap-filling
        title: NodeSwapFillingUp
        condition: C
        for: 1h
        labels:
          service: memory
          severity: warning
        annotations:
          summary: >-
            Less than half of swap is free and it has stayed that way
            for an hour. On snoc-beelink this is the signal that
            preceded the 16 September livelock by thirteen hours.
          runbook: >-
            Find the growth before it becomes a page:
            `ps -eo rss,etimes,args --sort=-rss | head -20` and
            `systemd-cgtop --order=memory`. Check swap held per
            process with
            `for f in /proc/[0-9]*/status; do awk '/^Name:/{n=$2}
            /^VmSwap:/{if ($2>50000) print $2, n}' $f; done | sort -rn`.
            systemd-oomd will not act until 90% of swap is gone.
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: ae8pyuqoyonpca
            model:
              refId: A
              instant: true
              editorMode: code
              expr: >-
                node_memory_SwapFree_bytes /
                (node_memory_SwapTotal_bytes > 0)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [0.5]

      # ── Headroom nearly gone ───────────────────────────────────
      #
      # MemAvailable is the kernel's own estimate of what can be
      # allocated without swapping, which makes it the right measure
      # here and free/used the wrong one -- page cache counts as
      # "used" and is reclaimable, so a used-memory rule alerts
      # constantly on a healthy server running Loki.
      #
      # 10%: the backtest shows beelink at 62% available on the
      # morning of the 15th, 25% by 14:00, 14% at 04:00 on the 16th
      # and 9% from 05:00. This fires around 05:00, roughly 90 minutes
      # before userspace stopped responding. That is late -- it is
      # meant to be. NodeSwapFillingUp is the rule with the useful
      # lead time; this one is the confirmation that the bleed was not
      # transient, and it is a page rather than a notification.
      - uid: batesste-node-memory-critical
        title: NodeMemoryCritical
        condition: C
        for: 15m
        labels:
          service: memory
          severity: critical
        annotations:
          summary: >-
            Under 10% of RAM is available and has been for fifteen
            minutes. The node is close to the point where reclaim
            costs more than the work it is reclaiming for.
          runbook: >-
            Shed load now rather than investigating first; this is
            about 90 minutes from an unrecoverable livelock on a small
            node. Stop the largest non-essential consumer
            (`systemd-cgtop --order=memory`), then look at why. SSH and
            tailscaled are ManagedOOMPreference=omit so remote access
            should survive even if systemd-oomd starts killing.
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: ae8pyuqoyonpca
            model:
              refId: A
              instant: true
              editorMode: code
              expr: >-
                node_memory_MemAvailable_bytes /
                node_memory_MemTotal_bytes
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [0.1]

      # ── It is happening now ────────────────────────────────────
      #
      # PSI "full" stall: the fraction of wall-clock time in which
      # *every* runnable task was blocked on memory. Unlike the two
      # rules above it does not measure a resource level, it measures
      # the symptom -- time the machine spent unable to make progress
      # -- which is precisely what a livelock is and precisely what
      # MemAvailable alone cannot distinguish from a well-tuned cache.
      #
      # 0.5% is not a round number, it is three times the highest
      # value any node in this fleet produced over seven days:
      #
      #   snoc-strix         0.15%   (three llama-servers, 2.6 GiB swapped)
      #   snoc-thinkstation  0.06%
      #   amd-laptop         0.03%
      #   snoc-gaming        0.00%
      #
      # On beelink through the incident: 0.03% at 04:30, 0.17% at
      # 05:00, 0.41% at 05:30, 0.69% at 06:00, 1.09% at 06:20, and
      # then 158% on the final partial scrape at 06:30 -- a figure
      # that exceeds 100% only because the counter jumped across a
      # scrape the node was too far gone to answer on time. Crossing
      # 0.5% happens around 05:30, an hour before the end.
      #
      # for: 10m rather than something shorter because a single
      # 5-minute rate sample crossing 0.5% is survivable; ten minutes
      # of it is the node grinding.
      - uid: batesste-node-memory-thrashing
        title: NodeMemoryThrashing
        condition: C
        for: 10m
        labels:
          service: memory
          severity: critical
        annotations:
          summary: >-
            The node is stalling on memory: every task has been
            blocked on reclaim for more than 0.5% of wall time, ten
            minutes running. This is the beginning of the swap-thrash
            livelock that cost snoc-beelink a power cycle.
          runbook: >-
            Act before investigating. If it is still reachable, kill
            the largest consumer immediately -- past this point the
            box can stop accepting SSH within the hour, and once it
            does the only remaining option is the power button.
            `journalctl -u systemd-oomd -g Killed` shows whether the
            backstop has already tried.
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: ae8pyuqoyonpca
            model:
              refId: A
              instant: true
              editorMode: code
              expr: >-
                rate(node_pressure_memory_stalled_seconds_total[5m])
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.005]

      # ── The backstop fired ─────────────────────────────────────
      #
      # node_vmstat_oom_kill counts kernel OOM kills. Through the
      # entire 16 September incident it did not move once, which is
      # the single most diagnostic fact about that outage: nothing was
      # ever killed, so nothing was ever reclaimed.
      #
      # A kill is not itself a failure -- it is the system working as
      # designed, and after installing systemd-oomd it is the expected
      # outcome of the conditions above. It still warrants a
      # notification, because something died and somebody should know
      # what and why. Warning, not critical.
      #
      # This counts kernel kills only. systemd-oomd's own kills do not
      # increment it and are not exported by node-exporter at all;
      # they land in the journal, and Loki has them via the
      # systemd-journal scrape. Worth a Loki-based rule eventually.
      - uid: batesste-node-oom-killed
        title: NodeOOMKilled
        condition: C
        for: 0m
        labels:
          service: memory
          severity: warning
        annotations:
          summary: >-
            The kernel OOM killer terminated a process in the last ten
            minutes. Something on this node asked for more memory than
            it could be given.
          runbook: >-
            `journalctl -k -g "Out of memory"` names the victim and
            its RSS at death. Cross-check `journalctl -u systemd-oomd`
            -- if oomd killed something first and the kernel still had
            to step in, the oomd thresholds in oomd/oomd.conf are too
            loose for this workload.
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: ae8pyuqoyonpca
            model:
              refId: A
              instant: true
              editorMode: code
              expr: increase(node_vmstat_oom_kill[10m])
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

  # Alert rules for filesystem exhaustion.
  #
  # Three rules for three distinct failure modes:
  #
  #   NodeDiskFillingUp   headroom is going, days out
  #   NodeDiskCritical    nearly gone, hours out
  #   NodeDiskInodesLow   space remains but files cannot be created
  #
  # All carry service=disk, which notification-policies.yaml routes on.
  #
  # Why this group exists: on 5 October 2026 snoc-beelink's root
  # volume was at 88% -- 12 GiB free of 98 GiB -- and nothing said so.
  # It was found by going and looking. Every number was in Prometheus
  # for weeks and no rule read any of it, which is precisely the gap
  # the memory group above was written to close for a different
  # resource. See journald/README.md for what was actually filling it.
  #
  # Thresholds are ratios rather than byte counts, for the same reason
  # the memory group uses them: one rule has to cover a 2 GiB /boot
  # and a 98 GiB root without per-host variants.
  #
  # Scoped to fstype=~"ext4|xfs" deliberately. The fleet also exports
  # vfat (/boot/efi, static and 99% free), 9p and rootfs from the WSL
  # node (/usr/lib/wsl/drivers is the Windows C: drive; /init is a
  # pseudo-mount), and a stack of /System/Volumes/* series from the
  # Mac that are all views of one APFS container. None of those are
  # disks this repo can act on, and alerting on eight series for one
  # physical volume is how a group gets muted.
  #
  # Known duplicate: amd-laptop reports / and /var/lib/docker as
  # separate series with identical values, because under WSL they are
  # the same device. Both entries are true; the notification policy
  # groups on mountpoint so they arrive together rather than as two
  # unrelated pages.
  #
  # Not used here: predict_linear. It is the obvious tool for "when
  # will this fill" and it does not survive contact with this fleet --
  # projecting snoc-beelink's /boot four days forward from a 6h window
  # yields -0.89 GiB, i.e. it would fire immediately and permanently.
  # /boot is a 2 GiB sawtooth that fills with kernel packages and
  # empties on autoremove, and a linear fit through one tooth always
  # points at zero. Level thresholds are duller and they are right.
  #
  # As with the memory group, every rule is noDataState: OK: a missing
  # series is a missing exporter, which is node-down alerting and a
  # different rule this repo still does not have.
  - orgId: 1
    name: disk
    folder: Alerts
    # Matches the backup group rather than memory's 1m. Disks fill
    # over days; a five-minute evaluation delay is noise against the
    # lead time these rules are built to give.
    interval: 5m
    rules:

      # ── Headroom going ─────────────────────────────────────────
      #
      # 15% free. Backtested against the week to 5 October: beelink's
      # root bottomed out at 10.5% free (min_over_time over 7d, 12.2%
      # at the moment it was noticed by hand), so this rule would have
      # fired with room to spare -- which is the whole point, since
      # nothing did. It would not have reached NodeDiskCritical's 5%,
      # which is the intended split: this one is the useful warning,
      # the other is the page.
      #
      # It is also quiet right now, which matters just as much. The
      # tightest filesystem in the fleet after that day's cleanup is
      # beelink's root at 25.5% free, then snoc-thinkstation at 27.4%
      # and snoc-strix at 31.5%. A threshold that fires on deployment
      # trains the habit of ignoring it.
      #
      # 1h of `for:` because a disk at 15% is not an emergency and a
      # container build or a backup staging run can dip below the line
      # for minutes at a time. There are days of margin here; one hour
      # of it buys confidence the dip is a trend.
      - uid: batesste-node-disk-filling
        title: NodeDiskFillingUp
        condition: C
        for: 1h
        labels:
          service: disk
          severity: warning
        annotations:
          summary: >-
            Less than 15% of this filesystem is free and has been for
            an hour. On snoc-beelink on 5 October the equivalent state
            went unnoticed until someone went looking.
          runbook: >-
            Find it with `du -xhd1 / | sort -rh | head -20`, repeating
            into whichever directory is largest -- `-x` matters, it
            stops du walking into other mounts. The usual suspects on
            this fleet are `/var/lib/docker` (`docker system df`, then
            `docker image prune`), `/var/lib/prometheus` (capped at
            20 GiB by --storage.tsdb.retention.size), package and
            build caches under `~/.cache` and `~/.npm`, and stale
            `~/.vscode-server/cli/servers` versions. Check
            `journalctl --disk-usage` against the 1 GiB cap in
            journald/journald.conf. Do NOT run `docker volume prune`
            on snoc-beelink: several named volumes holding Time
            Machine and Firefly data report as dangling.
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: ae8pyuqoyonpca
            model:
              refId: A
              instant: true
              editorMode: code
              expr: >-
                node_filesystem_avail_bytes{fstype=~"ext4|xfs"} /
                (node_filesystem_size_bytes{fstype=~"ext4|xfs"} > 0)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [0.15]

      # ── Nearly gone ────────────────────────────────────────────
      #
      # 5%, and a page rather than a notification.
      #
      # The gap between this and the warning above is deliberately
      # wide. On a 98 GiB root, 15% to 5% is about 10 GiB of runway;
      # at the rate this fleet actually fills -- beelink's root moved
      # single-digit GiB over the weeks before October -- that is days
      # of warning, not minutes.
      #
      # What makes 5% the right floor rather than 0 is that a full
      # root does not degrade gracefully. Package upgrades fail
      # halfway, journald stops writing the record of what went wrong,
      # Docker pulls leave partial layers, and Prometheus stops
      # recording the metrics that would explain it afterwards. 5% of
      # 98 GiB is ~5 GiB, enough to still fix the problem with the
      # normal tools.
      - uid: batesste-node-disk-critical
        title: NodeDiskCritical
        condition: C
        for: 15m
        labels:
          service: disk
          severity: critical
        annotations:
          summary: >-
            Under 5% of this filesystem is free. Past this point
            upgrades, container pulls and the logging that would
            explain the problem all start failing.
          runbook: >-
            Reclaim first, investigate second. Safe immediate wins on
            a Linux node here: `sudo apt clean`,
            `sudo journalctl --vacuum-size=200M`,
            `docker image prune`, `npm cache clean --force`. If this
            is snoc-beelink's root, note that /var/lib/loki is a
            separate LV and is not the cause. Then find the real
            consumer with `du -xhd1 / | sort -rh | head -20` before
            deciding what gets a permanent cap.
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: ae8pyuqoyonpca
            model:
              refId: A
              instant: true
              editorMode: code
              expr: >-
                node_filesystem_avail_bytes{fstype=~"ext4|xfs"} /
                (node_filesystem_size_bytes{fstype=~"ext4|xfs"} > 0)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [0.05]

      # ── Space left, no inodes ──────────────────────────────────
      #
      # A separate rule because it is a separate failure, and one that
      # reads as a lie from every tool that reports free space: `df -h`
      # shows room, writes fail with ENOSPC, and nothing in the two
      # rules above moves at all. `df -i` is the one that tells the
      # truth.
      #
      # ext4 fixes the inode count at mkfs time, so this is reached by
      # creating many small files rather than large ones -- which is
      # exactly the shape of the things that grow on this fleet:
      # node_modules trees, pip and npm caches, Docker overlay layers,
      # and Loki chunk directories.
      #
      # 10% free, which is quiet by a wide margin today: the tightest
      # in the fleet is beelink's root at 79.6% of inodes free. The
      # margin is the point -- there is no gradual symptom to notice
      # before this one fires.
      #
      # The `> 0` on files is the same filter used in the swap rule:
      # it drops filesystems reporting no inodes at all rather than
      # dividing by zero and alerting on NaN forever.
      - uid: batesste-node-disk-inodes-low
        title: NodeDiskInodesLow
        condition: C
        for: 1h
        labels:
          service: disk
          severity: warning
        annotations:
          summary: >-
            Under 10% of this filesystem's inodes are free. Writes
            will start failing with ENOSPC while df still reports
            free space.
          runbook: >-
            Confirm with `df -i`, then find the directories holding
            the most files, not the most bytes:
            `sudo find / -xdev -type d -printf '%h\n' | sort | uniq -c
            | sort -rn | head -20`. Usual causes on this fleet are
            node_modules trees, ~/.npm/_cacache, pip wheels and
            Docker overlay layers -- `docker system prune` is the
            fastest single reclaim, but read NodeDiskFillingUp's
            runbook on volumes first.
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: ae8pyuqoyonpca
            model:
              refId: A
              instant: true
              editorMode: code
              expr: >-
                node_filesystem_files_free{fstype=~"ext4|xfs"} /
                (node_filesystem_files{fstype=~"ext4|xfs"} > 0)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [0.1]
