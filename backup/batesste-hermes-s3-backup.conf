# Non-secret settings for batesste-hermes-s3-backup. Installed to
# ~/.config/batesste-hermes-s3-backup/ and read by the unit before
# ~/.secrets.env, which supplies AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY from the stow-managed dotfiles.

AWS_REGION=us-west-2
AWS_BUCKET=batesste-hermes-backups
PRUNE_DAYS=90
BACKUP_WORKDIR=/var/tmp/hermes-backup
