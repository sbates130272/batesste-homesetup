# Non-secret settings for batesste-s3-backup. Installed to
# /usr/local/share/batesste-s3-backup/ and read by the unit before
# ~/.secrets.env, which supplies AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY from the stow-managed dotfiles.
#
# MOUNT_POINT must not exist when the run starts; the script creates
# and removes it.

BLK_DEVICE=/dev/sda
MOUNT_POINT=/mnt/batesste-s3-backup
AWS_REGION=us-west-2
AWS_BUCKET=batesste-homelab-backups
PRUNE_DAYS=30
EXCEPT_DAY=1
