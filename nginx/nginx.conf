user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events { worker_connections 768; }

http {
  # Send "Connection: upgrade" only for real WebSocket handshakes and
  # "Connection: close" otherwise. Hardcoding "upgrade" on a plain HTTP
  # request is a protocol error that some backends reject.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Virtual Host Configs
  include /etc/nginx/conf.d/*.conf;
  include /etc/nginx/sites-enabled/*.site;
}
