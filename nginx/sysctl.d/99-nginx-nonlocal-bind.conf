# Allow nginx to bind 10.0.0.15 before wlp2s0 has acquired its DHCP
# lease. Without this nginx loses the boot race against WiFi
# association and dies with:
#
#   nginx: [emerg] bind() to 10.0.0.15:80 failed
#          (99: Cannot assign requested address)
#
# network-online.target does not gate this on the box: NetworkManager
# is not installed and systemd-networkd-wait-online never runs, so the
# target fires ~0.1 ms after network.target. Binding non-locally is the
# fix; the socket starts receiving as soon as the address appears.
#
# See nginx/README.md for the full analysis.

net.ipv4.ip_nonlocal_bind = 1
net.ipv6.ip_nonlocal_bind = 1
