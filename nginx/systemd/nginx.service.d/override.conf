# Belt-and-braces only. The actual boot fix is ip_nonlocal_bind (see
# sysctl.d/99-nginx-nonlocal-bind.conf); this just catches other
# transient start failures.
#
# Deliberately does not re-assert After=network-online.target: the
# stock unit already has it, and it is inert on this box.

[Service]
Restart=on-failure
RestartSec=5
