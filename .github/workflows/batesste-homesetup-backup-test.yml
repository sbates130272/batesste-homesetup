name: batesste-homesetup
on:
  pull_request:
    paths:
      - 'backup/**'
      - '!backup/README.md'

jobs:
  backup-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: ./backup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
      - name: Install mount-s3
        run: |
          wget https://s3.amazonaws.com/mountpoint-s3-release/latest/x86_64/mount-s3.deb
          sudo apt-get install -y ./mount-s3.deb
      - name: Install batesste-s3-backup systemd service and timer
        run: |
          sudo cp batesste-s3-backup /usr/local/bin/
          sudo cp batesste-s3-backup.service /etc/systemd/system/
          sudo cp batesste-s3-backup.timer /etc/systemd/system/
          sudo mkdir -p /usr/local/share/batesste-s3-backup
          sudo cp batesste-s3-backup.conf /usr/local/share/batesste-s3-backup/
      - name: Start up the batesste-s3-backup systemd service and timer
        run: |
          sudo systemctl daemon-reload
          sudo systemctl enable batesste-s3-backup.timer
          sudo systemctl start batesste-s3-backup.timer
      # The S3 round-trip needs credentials this repo cannot mint for
      # itself, and a rotated or revoked key is a chore rather than a
      # defect in anything here. Ask AWS first, so the rest of the job
      # still reports on the units and the script.
      - name: Check whether the AWS credentials still work
        id: creds
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET }}
          AWS_REGION: us-west-2
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "usable=false" >> "${GITHUB_OUTPUT}"
            echo "reason=no AWS credentials are configured for this repository" \
              >> "${GITHUB_OUTPUT}"
          elif err=$(aws sts get-caller-identity --output text 2>&1 >/dev/null); then
            echo "usable=true" >> "${GITHUB_OUTPUT}"
          else
            echo "usable=false" >> "${GITHUB_OUTPUT}"
            echo "reason=AWS rejected them: ${err##*: }" >> "${GITHUB_OUTPUT}"
          fi
      - name: Run a local test as a sanity-check
        if: steps.creds.outputs.usable == 'true'
        run: |
          dd if=/dev/urandom of=./test.data bs=1M count=10
          sudo -E ./batesste-s3-backup
        env:
          FILE_MODE: true
          BLK_DEVICE: test.data
          MOUNT_POINT: /mnt/batesste-s3-backup
          AWS_BUCKET: batesste-homelab-backups-ci
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET }}
      - name: Note the skipped S3 sanity-check
        if: steps.creds.outputs.usable != 'true'
        run: |
          echo "::warning title=S3 sanity-check skipped::${{ steps.creds.outputs.reason }}. Rotate the AWS_KEY and AWS_SECRET repository secrets to restore this coverage."
