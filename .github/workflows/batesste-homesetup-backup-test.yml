name: batesste-homesetup
on:
  pull_request:
    paths:
      - 'backup/**'
      - '!backup/README.md'
  # A path-filtered pull_request trigger only ever runs when someone
  # edits backup/. Credentials do not rot on that schedule: the
  # AWS_KEY/AWS_SECRET secrets went bad and no PR touched this
  # directory for months, so the one check that would have noticed
  # simply never ran. The weekly build is what makes this job a
  # monitor rather than a linter.
  #
  # Off the hour deliberately -- GitHub queues scheduled workflows at
  # :00 across the whole platform, and jobs there are routinely
  # delayed or dropped.
  schedule:
    - cron: '17 14 * * 1'
  workflow_dispatch:

jobs:
  backup-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: ./backup
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Install mount-s3
        run: |
          wget https://s3.amazonaws.com/mountpoint-s3-release/latest/x86_64/mount-s3.deb
          sudo apt-get install -y ./mount-s3.deb
      - name: Install batesste-s3-backup systemd service and timer
        run: |
          sudo cp batesste-s3-backup /usr/local/bin/
          sudo cp batesste-s3-backup.service /etc/systemd/system/
          sudo cp batesste-s3-backup.timer /etc/systemd/system/
          sudo mkdir -p /usr/local/share/batesste-s3-backup
          sudo cp batesste-s3-backup.conf /usr/local/share/batesste-s3-backup/
      - name: Start up the batesste-s3-backup systemd service and timer
        run: |
          sudo systemctl daemon-reload
          sudo systemctl enable batesste-s3-backup.timer
          sudo systemctl start batesste-s3-backup.timer
      # The S3 round-trip needs credentials this repo cannot mint for
      # itself. This step used to treat a rejected key as a chore
      # rather than a defect and downgrade it to a ::warning, which
      # let the job report success while testing nothing -- the run on
      # 8 Sep 2026 passed green with "AWS rejected them: The security
      # token included in the request is invalid." A backup test that
      # goes green when it cannot reach the bucket is worse than no
      # test, because it is the thing you check to decide whether to
      # look closer.
      #
      # So: bad credentials now fail the job. The single exception is
      # a pull request from a fork, where GitHub withholds secrets by
      # design and no contributor can do anything about it.
      - name: Check whether the AWS credentials still work
        id: creds
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET }}
          AWS_REGION: us-west-2
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          fail() {
            echo "::error title=Backup S3 check failed::$1"
            echo "usable=false" >> "${GITHUB_OUTPUT}"
            exit 1
          }

          if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            if [ "${IS_FORK}" = "true" ]; then
              echo "usable=false" >> "${GITHUB_OUTPUT}"
              echo "::warning title=S3 sanity-check skipped::Pull requests from forks cannot access repository secrets. A maintainer must re-run this on a branch in the repository to exercise the S3 round-trip."
              exit 0
            fi
            fail "No AWS credentials are configured for this repository. Set the AWS_KEY and AWS_SECRET repository secrets."
          fi

          if err=$(aws sts get-caller-identity --output text 2>&1 >/dev/null); then
            echo "usable=true" >> "${GITHUB_OUTPUT}"
          else
            fail "AWS rejected the credentials: ${err##*: } Rotate the AWS_KEY and AWS_SECRET repository secrets. Note these are a separate store from ~/.secrets.env on snoc-beelink, which the live backup uses -- rotating one does not rotate the other, and they have drifted apart before."
          fi
      - name: Run a local test as a sanity-check
        if: steps.creds.outputs.usable == 'true'
        run: |
          dd if=/dev/urandom of=./test.data bs=1M count=10
          sudo -E ./batesste-s3-backup
        env:
          FILE_MODE: true
          BLK_DEVICE: test.data
          MOUNT_POINT: /mnt/batesste-s3-backup
          AWS_BUCKET: batesste-homelab-backups-ci
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET }}
      # Only reachable on a fork PR now; every other unusable-credential
      # path fails the job above.
      - name: Note the skipped S3 sanity-check
        if: steps.creds.outputs.usable != 'true'
        run: |
          echo "S3 round-trip was skipped because repository secrets are unavailable to fork pull requests."
