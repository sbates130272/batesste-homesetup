name: batesste-homesetup
on:
  pull_request:
    paths:
      - 'grafana/**'
      - '!grafana/README.md'
      # A plug renamed here silently drops its fixed color on the
      # Emporia dashboard, so a labels.json edit runs this job too.
      - 'prometheus/emvue-exporter/labels.json'

jobs:
  grafana-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: ./grafana
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Validate all dashboard JSON files
        run: |
          found=0
          for f in dashboards/*/*.json; do
            [ -f "$f" ] || continue
            echo "Checking ${f}..."
            jq empty "${f}"
            found=$((found + 1))
          done
          echo "Validated ${found} dashboard(s)."
          if [ "${found}" -eq 0 ]; then
            echo "Error: no dashboard JSON files found."
            exit 1
          fi

      - name: Validate provisioning YAML files
        run: |
          pip install pyyaml --quiet
          for f in provisioning/*/*.yaml; do
            [ -f "$f" ] || continue
            echo "Checking ${f}..."
            python3 -c "
          import yaml, sys
          with open('${f}') as fh:
              yaml.safe_load(fh)
          "
          done

      - name: Check emporia plug colors cover every plug
        run: |
          python3 - <<'PY'
          import json, sys

          dash = json.load(open(
              "dashboards/home-network-related/"
              "emporia-smartplugs-dashboard.json"))
          labels = json.load(open("../prometheus/emvue-exporter/labels.json"))

          want = {p["name"] for p in labels.values()}
          bad = []
          for panel in dash["panels"]:
              if panel["type"] != "timeseries":
                  continue
              have = {o["matcher"]["options"]
                      for o in panel["fieldConfig"]["overrides"]
                      if o["matcher"]["id"] == "byName"}
              for missing in sorted(want - have):
                  bad.append(f"{panel['title']}: no color for {missing!r}")
              for extra in sorted(have - want):
                  bad.append(f"{panel['title']}: color for unknown "
                             f"plug {extra!r}")

          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print(f"Every timeseries panel colors all {len(want)} plugs.")
          PY

      - name: Validate deploy.sh dry-run
        run: |
          ./deploy.sh --dry-run
