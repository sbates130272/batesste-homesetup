name: batesste-homesetup
on:
  pull_request:
    paths:
      - 'prometheus/**'
      - '!prometheus/README.md'

jobs:
  prometheus-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: ./prometheus
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
      - name: Install Prometheus for promtool
        run: |
          sudo apt-get update
          sudo apt-get install -y prometheus
      - name: Create targets directory for validation
        run: |
          sudo mkdir -p /etc/prometheus/targets
          sudo cp targets/*.json /etc/prometheus/targets/
      - name: Stub scrape credential files for validation
        run: |
          # promtool stats every credentials_file referenced by
          # prometheus.yml. The real secret only exists on the
          # homelab host, so CI validates against a placeholder.
          sudo mkdir -p /etc/prometheus/secrets
          echo -n placeholder \
            | sudo tee /etc/prometheus/secrets/lemonade-api-key \
              >/dev/null
          sudo chmod 0444 /etc/prometheus/secrets/lemonade-api-key
      - name: Validate prometheus.yml
        run: |
          promtool check config prometheus.yml
      - name: Validate all target JSON files
        run: |
          for f in targets/*.json; do
            echo "Checking ${f}..."
            jq empty "${f}"
          done
      - name: Validate add-target.sh runs
        run: |
          ./add-target.sh node 10.0.0.99:9100 \
              server_name=snoc-ci-test
          jq -e \
            '.[] | select(.targets[] == "10.0.0.99:9100")' \
            targets/node.json
          git checkout targets/node.json
      - name: Validate emvue-exporter labels.json
        run: |
          jq empty emvue-exporter/labels.json
          # Every plug must carry a name: it is what the Emporia
          # SmartPlugs dashboard legends each series on, and a plug
          # without one renders as a blank gauge rather than an error.
          jq -e 'to_entries | all(.value.name != null and
                                  .value.name != "")' \
            emvue-exporter/labels.json
          # The dashboard's Status picker defaults to active, so a plug
          # with no status is filtered out of the default view and looks
          # like it stopped reporting.
          jq -e 'to_entries | all(.value.status == "active" or
                                  .value.status == "unused")' \
            emvue-exporter/labels.json
      - name: Validate deploy.sh dry-run
        run: |
          ./deploy.sh --dry-run
          ./emvue-exporter/deploy.sh --dry-run
