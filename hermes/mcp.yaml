# Hermes MCP servers on snoc-beelink.
#
# This file is the source of truth for the whole `mcp_servers:` map in
# ~/.hermes/config.yaml. Apply it with ./apply-model-config.py, which
# *replaces* that key rather than merging into it -- so deleting a server
# here deletes it there. That is deliberate: the two servers this file
# replaced were dead for months precisely because nothing ever removed
# them, and a merge-only apply could not have.
#
# Keys are never stored here. `${VAR}` placeholders are resolved by
# Hermes at load time from ~/.hermes/.env (tools/mcp_tool_config.py,
# _interpolate_env_vars). An unset variable keeps the literal
# placeholder, which fails as an auth error rather than silently
# running unauthenticated.

# GitHub's own hosted server, over streamable HTTP. It used to be
# `npx -y @modelcontextprotocol/server-github`, which never once ran:
# there is no Node on this box, so Hermes parked it at every startup.
# The hosted endpoint needs no runtime at all, and the PAT already in
# ~/.hermes/.env is the only credential it wants.
#
# The tool names below are not the old ones. The hosted server
# consolidated the per-verb tools into read/write pairs -- get_issue and
# create_issue are now issue_read and issue_write -- so the old include
# list would have silently selected the four names that happened to
# survive and dropped the other four. This is the same eight
# capabilities, renamed.
github:
  url: https://api.githubcopilot.com/mcp/
  headers:
    # Referencing the existing variable rather than the MCP_GITHUB_API_KEY
    # the `hermes mcp add` flow would have created: a second copy of a PAT
    # is one more thing to rotate and one more thing to get out of sync.
    Authorization: Bearer ${GITHUB_PERSONAL_ACCESS_TOKEN}
  tools:
    include:
      - search_repositories
      - get_file_contents
      - list_issues
      - issue_read
      - issue_write
      - list_pull_requests
      - pull_request_read
      - pull_request_review_write
    resources: false
    prompts: false

# Local read-only view of Firefly III, from
# ~/.hermes/workspace/mcp/firefly_mcp.py.
#
# It runs out of that directory's own .venv, not the Hermes venv. It used
# to share the Hermes venv, and a Hermes update that moved `mcp` to 2.0
# broke it at import: fastmcp 3.x wants a symbol 2.0 dropped. Sharing a
# venv with Hermes made Hermes's dependency churn this server's problem,
# and the breakage was invisible because `hermes mcp list` reports the
# config, not a connection.
firefly:
  command: /home/batesste/.hermes/workspace/mcp/.venv/bin/python
  args:
    - /home/batesste/.hermes/workspace/mcp/firefly_mcp.py
  env:
    FIREFLY_URL: http://localhost:1080
    # Was a 980-character JWT inline in config.yaml, byte-identical to
    # the copy already in ~/.hermes/.env. config.yaml is world-readable
    # in every backup and every diff this repo prints; .env is not.
    FIREFLY_TOKEN: ${FIREFLY_API_TOKEN}
  # All eight the server exposes. The first three are Firefly reads; the
  # rest are the Google Drive and Apple Calendar handlers that had been
  # written, shipped and then left unreachable by an include list that
  # predated them.
  #
  # create_calendar_event is the only write in the set. The server refuses
  # it without an explicit confirmation argument, and the apple-calendar
  # skill states the same rule, so it is guarded in two places.
  #
  # list_google_files and google_doc_content need GOOGLE_SERVICE_ACCOUNT_KEY
  # in ~/.hermes/.env. That variable exists but has not been verified
  # end-to-end; if Drive calls fail, that is the first thing to check.
  tools:
    include:
      - list_accounts
      - search_transactions
      - get_account_balance
      - list_google_files
      - google_doc_content
      - list_calendar_events
      - create_calendar_event
      - server_info
    resources: false
    prompts: false

# Home Assistant on this same box, over streamable HTTP on loopback.
# See ../home-assistant/README.md for the deployment.
#
# What this exposes is Home Assistant's Assist API and nothing else: the
# tools are the Assist intents (HassTurnOn, HassLightSet, GetLiveContext
# and friends), scoped to whatever is listed under Settings > Voice
# assistants > Expose. An entity that is not exposed there does not exist
# as far as Hermes is concerned, whatever this file says. That page is the
# real access control, not this one -- worth knowing before exposing the
# door locks.
#
# There is no `include` list here, and that is a departure from the two
# servers above. Their tool names are fixed by the server; these are
# generated from the exposed entities and the selected LLM API, so any
# list written today would silently drop whatever is added tomorrow --
# the same failure the GitHub entry above describes, except that here it
# would recur on every change to the house rather than once per server
# upgrade.
#
# The endpoint is 127.0.0.1, not the tailnet name. Both Hermes and Home
# Assistant run on snoc-beelink, so going out to tailscaled and back for
# TLS would buy nothing; the tailnet listener exists for phones and for
# the other nodes.
homeassistant:
  # Streamable HTTP. The older SSE endpoint at /mcp_server/sse still
  # answers, and is what most of the third-party write-ups still show;
  # Hermes supports both transports, so the only reason to fall back to
  # it is a Home Assistant older than this one.
  url: http://127.0.0.1:8123/api/mcp
  headers:
    # A long-lived access token, created under Profile > Security in the
    # Home Assistant UI and stored in ~/.hermes/.env. It carries the full
    # privileges of the account that created it, so it is an
    # administrator credential wearing an API token's clothes -- which is
    # the other reason the Expose page matters.
    Authorization: Bearer ${HOMEASSISTANT_TOKEN}
  # Spelled out because an absent key here means `full`, and silence
  # reads like nobody thought about it. This was decided: HassTurnOn,
  # HassTurnOff, HassLightSet, HassSetPosition and the shopping-list
  # writes run with no approval prompt, from every surface including
  # the gateway's unattended ones and the cron scheduler.
  #
  # The alternative is `untrusted`, and its cost is not what it looks
  # like: Home Assistant builds its tools without `annotations`, so
  # `readOnlyHint` is absent on all of them and nothing counts as read
  # only -- `untrusted` prompts on every call, including the
  # GetLiveContext snapshot, on every turn that touches the house.
  #
  # What actually bounds this is Settings > Voice assistants > Expose,
  # not this key. Worth re-reading the moment the first real switch is
  # exposed; today the blast radius is one to-do list.
  trust: full
  tools:
    # Enabled, unlike the two servers above. Home Assistant publishes one
    # resource, homeassistant://assist/context-snapshot, which is the
    # current state of every exposed entity in one read. That is exactly
    # the thing an agent otherwise burns a dozen tool calls discovering.
    # It only appears when the configured LLM API includes GetLiveContext.
    resources: true
    prompts: false

# Deliberately absent: `fetch`. It was the second `command: npx` entry
# and had never started either. Nothing was lost -- Hermes ships native
# web_search and web_extract tools plus a browser toolset, all of which
# work today, so the MCP server was redundant even on a box with Node.
