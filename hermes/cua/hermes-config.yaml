# The Hermes side of the computer-use setup on snoc-beelink.
#
# Apply it with ../apply-model-config.py, which merges these keys into
# ~/.hermes/config.yaml alongside models.yaml and mcp.yaml. Kept separate
# from models.yaml because it pins no model: what lives here is which
# toolset is on and how far the agent is allowed to go with it.
#
# The other half of the wiring is HERMES_CUA_DRIVER_CMD in ~/.hermes/.env,
# which cannot live in config.yaml -- Hermes reads the driver path from the
# environment only. deploy.sh writes it.

# The toolset list is replaced wholesale, not appended to (deep_merge
# replaces lists), so this has to name hermes-cli as well as the new entry.
# hermes-cli is what was there before.
toolsets:
  - hermes-cli
  - computer_use

computer_use:
  # standard, and it has to be.
  #
  # First, the thing this is NOT. The per-action approval prompts are
  # Hermes', not the driver's: handle_computer_use calls _request_approval
  # before it constructs a backend at all, so permission_mode is never
  # consulted and cannot quiet them. An earlier version of this comment
  # claimed otherwise and was simply wrong. approvals.yaml is what silences
  # them, by naming each `cua:<action>:<mode>` scope in command_allowlist.
  #
  # bounded was then tried as the compensating ceiling -- deny-by-default
  # enforcement inside the driver, to replace a prompt nobody reads at the
  # fortieth click. It does not work here, for a structural reason rather
  # than a fixable one. Any permission_mode other than standard makes Hermes
  # take the _EmbeddedCuaDaemon path, which spawns
  #
  #     cua-driver serve --embedded --socket /tmp/hc-<token>.sock
  #
  # and then connects to that socket itself. The driver on this box is a
  # `docker exec` into batesste-cua-driver, so the socket is created in the
  # container's filesystem and the host connects to a path that does not
  # exist. Same for --capability-manifest: cua_backend_daemon.py checks
  # os.path.isfile() on the host and hands the identical string to a process
  # that resolves it in the container. Both would need host paths bind-
  # mounted into the sandbox, and a sandbox that can write the host's /tmp
  # is most of the way to not being a sandbox.
  #
  # The ceiling that remains is the container itself: no host filesystem, no
  # network reachable but loopback noVNC, memory and pid limits. See
  # capability-manifest.yaml, which is kept and installed for the day the
  # driver runs on the host.
  permission_mode: standard

  # The overlay cursor is a fullscreen always-on-top X window. Hermes
  # already auto-disables it for headless Linux and containers, but the
  # detection runs against the *host* environment, and the host is not
  # where the X server is. Stated explicitly so the answer does not depend
  # on a heuristic looking at the wrong machine.
  no_overlay: true

  # The desktop is 1920x1080 and the 4B that serves auxiliary.vision
  # downscales to 1456 on its longest edge anyway. Matching it here means
  # one resize instead of two and no tokens spent on detail that is
  # discarded before the model sees it.
  max_image_dimension: 1456

  # Xvfb is X11, and the native-Wayland path is an opt-in that only
  # applies when the driver process has WAYLAND_DISPLAY. Left false so a
  # future desktop-environment change has to be a deliberate edit.
  native_wayland: false
