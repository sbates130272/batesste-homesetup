# Bind the dashboard to loopback instead of 0.0.0.0.
#
# The stock unit passes --host 0.0.0.0, which takes port 9119 on every
# interface including the tailnet address. tailscaled needs to bind
# 100.118.22.104:9119 itself to terminate TLS for its
# "serve :9119 -> 127.0.0.1:9119" entry, so it lost the race on every
# boot and retried forever:
#
#   tailscaled: localListener failed to listen on 100.118.22.104:9119,
#               backing off: bind: address already in use
#
# On loopback the conflict disappears and the dashboard is reached
# through tailscale serve, which adds TLS and tailnet ACLs in front of
# what is otherwise an --insecure listener.
#
# A drop-in rather than an edit to the unit, so a hermes reinstall that
# regenerates hermes-dashboard.service does not silently undo it.

[Service]
ExecStart=
ExecStart=/home/batesste/.hermes/hermes-agent/venv/bin/python -m hermes_cli.main dashboard --host 127.0.0.1 --insecure --no-open --skip-build
