# batesste-homelab Prometheus Config
#
# Targets are managed via file_sd_configs. Each job watches
# two locations:
#   targets/<job>.json            Manual/static targets
#   targets/discovered/<job>.json Auto-discovered via Avahi
# Prometheus watches these files and picks up changes
# automatically without a restart or reload.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

  # external_labels are attached only when talking to *external*
  # systems -- Alertmanager, federation, outbound remote_write. They
  # are NOT stored on local series: `count(up{monitor="example"})` is
  # 0 against this very config. So this does not give homelab metrics
  # a cluster label you can select on in a query, and adding it here
  # to get one will not work.
  #
  # It is worth setting anyway. This box is a remote-write sink
  # (--web.enable-remote-write-receiver, see prometheus.defaults) for
  # clusters that each stamp their own `cluster` -- roughly 183k
  # series pushed in against 10k scraped here. Without one of our own,
  # an alert from this server arrives at Alertmanager as the only
  # anonymous one in that crowd.
  external_labels:
    monitor: 'example'
    cluster: 'snoc-lan'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: prometheus
    scrape_interval: 5s
    scrape_timeout: 5s
    # Scrape Prometheus directly on its own listener, so a bare
    # /metrics is correct. Port 9090 is the nginx listener that
    # fronts it; going via nginx returns 401 because that vhost
    # requires auth. Both flags live in prometheus.defaults.
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/prometheus.json
        refresh_interval: 30s

  - job_name: node
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/node.json
          - /etc/prometheus/targets/discovered/node.json
        refresh_interval: 30s

  - job_name: emporia
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/emporia.json
          - /etc/prometheus/targets/discovered/emporia.json
        refresh_interval: 30s

  - job_name: speedtest_probe
    metrics_path: /probe
    params:
      script: [speedtest]
    scrape_interval: 15m
    scrape_timeout: 90s
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/speedtest_probe.json
          - /etc/prometheus/targets/discovered/speedtest_probe.json
        refresh_interval: 30s

  - job_name: speedtest_exporter
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/speedtest_exporter.json
          - /etc/prometheus/targets/discovered/speedtest_exporter.json
        refresh_interval: 30s

  - job_name: icloud
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/icloud.json
          - /etc/prometheus/targets/discovered/icloud.json
        refresh_interval: 30s

  - job_name: amd-gpu-metrics-exporter
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/amd-gpu-metrics-exporter.json
          - /etc/prometheus/targets/discovered/amd-gpu-metrics-exporter.json
        refresh_interval: 30s
    # Order matters here. The hostname rule runs first so the
    # card_model rule that follows can match on homelab names.
    metric_relabel_configs:
      # The exporter stamps every sample with gethostname(), which
      # on amd-laptop is APCAN-MQ60818VV. Left alone that label
      # joins to nothing: every dashboard and every other job keys
      # on the server_name file_sd applies. Same normalisation the
      # hsa-snoop job does below, and the same reason Alloy ships
      # LOKI_HOST_LABEL rather than constants.hostname.
      - source_labels: [server_name]
        target_label: hostname

      # Normalise every sample to the amd_ prefix on ingest.
      #
      # MetricsFieldPrefix: "amd_" is the exporter's own packaged
      # default, but whether a given build honours it varies by
      # version and platform, and it moves under us -- amd-laptop
      # served bare gpu_* one morning and amd_gpu_* that evening
      # after an exporter upgrade, with no change on this box.
      # Deliberately no list of which hosts are prefixed today:
      # that is a snapshot, not a rule, and the last one was wrong
      # within a day.
      #
      # The AMD dashboards drive every query off one global
      # g_metrics_prefix variable defaulted to "amd_", so an
      # unprefixed host scrapes green and renders empty on every
      # panel. This rule makes the prefix an invariant of the TSDB
      # rather than a property of each remote build, which is why
      # it stays even when every exporter happens to agree -- and
      # keeps the fix in the repo rather than in config.json on a
      # Windows box and a corporate laptop.
      #
      # The regex is fully anchored, so already-prefixed amd_* and
      # promhttp_* cannot match and pass through untouched.
      - source_labels: [__name__]
        regex: '(gpu|pcie)_(.*)'
        target_label: __name__
        replacement: 'amd_${1}_${2}'

      # Prometheus drops empty labels, so card_model="" does not
      # render as blank -- the label vanishes and the GPU column
      # has nothing to show. This hardcodes it for the one host
      # still serving "".
      #
      # It matches on an *empty* card_model, so an exporter that
      # starts populating the field wins automatically instead of
      # fighting a stale override. That is not theoretical: the
      # equivalent rules for snoc-strix and amd-laptop both went
      # dead on their own once their exporters began reporting the
      # part, and were removed. snoc-thinkstation is the last one
      # left; amd-smi static there knows the name but the exporter
      # never plumbs it through.
      - source_labels: [hostname, card_model]
        separator: ;
        regex: 'snoc-thinkstation;'
        target_label: card_model
        replacement: 'Radeon RX 9070 XT'

      # snoc-gaming's Windows build exports a much smaller set:
      # ~88 families, almost all gpu_ecc_*, plus VRAM/GTT,
      # gpu_health, XGMI and pcie_speed. It has NO gfx_activity,
      # power, temp or clock, so its GPU Inventory row shows Node,
      # GPU and Exporter and leaves Temp/Power/Busy blank. That is
      # the exporter's coverage on Windows, not a broken scrape --
      # do not "fix" the blank columns by repointing them at
      # something that resolves.

  - job_name: ais-exporter
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/ais-exporter.json
          - /etc/prometheus/targets/discovered/ais-exporter.json
        refresh_interval: 30s

  - job_name: rdma-exporter
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/rdma-exporter.json
          - /etc/prometheus/targets/discovered/rdma-exporter.json
        refresh_interval: 30s

  - job_name: nvme-exporter
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/nvme-exporter.json
          - /etc/prometheus/targets/discovered/nvme-exporter.json
        refresh_interval: 30s

  - job_name: hsa-snoop
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/hsa-snoop.json
          - /etc/prometheus/targets/discovered/hsa-snoop.json
        refresh_interval: 30s
    # hsa-snoop stamps every metric with a constant `host`
    # label taken from gethostname(), and the HSA Snoop
    # dashboard drives its picker from
    # label_values(hsa_snoop_up, host). Normalise it to the
    # server_name file_sd applies, so the picker agrees with
    # every other dashboard even when the box's kernel
    # hostname differs from its homelab name.
    metric_relabel_configs:
      - source_labels: [server_name]
        target_label: host

  - job_name: openai_exporter
    scrape_interval: 60s
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/openai_exporter.json
          - /etc/prometheus/targets/discovered/openai_exporter.json
        refresh_interval: 30s

  - job_name: cursor-exporter
    scrape_interval: 60s
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/cursor-exporter.json
          - /etc/prometheus/targets/discovered/cursor-exporter.json
        refresh_interval: 30s

  # Loki serves its own metrics on the same port it ingests on.
  # Worth scraping for more than tidiness: retention is enforced
  # by time, not size, so ingestion rate is the only advance
  # warning that /var/lib/loki is about to hit its 12G volume.
  - job_name: loki
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/loki.json
        refresh_interval: 30s

  # amd-laptop is absent from alloy.json. It ships logs to Loki
  # fine, but its Alloy metrics port is not reachable from here:
  # Alloy listens on *:12345 and the INPUT policy is ACCEPT with
  # no rules, yet 12345 and 12346 both time out from the beelink.
  #
  # This is a host firewall allowlist below iptables, not a
  # blanket block -- 9100 (node-exporter) and 5000 (the GPU
  # exporter, added to amd-gpu-metrics-exporter.json above) both
  # answer from the same source. So the fix is an explicit
  # inbound rule for 12345 on that machine, the same shape as the
  # node_exporter rules in snoc-gaming.md. Re-add the target once
  # that rule exists; until then a permanently red target would
  # only train us to ignore the light.
  - job_name: alloy
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/alloy.json
          - /etc/prometheus/targets/discovered/alloy.json
        refresh_interval: 30s

  # Lemonade exposes its own metrics endpoint over Tailscale
  # (TLS, token auth). Static rather than file_sd because
  # there is one such endpoint, not a discoverable fleet.
  # server_name matches the label file_sd applies to other
  # jobs; the Lemonade dashboard keys its instance variable
  # on it.
  - job_name: lemonade-snoc-strix
    scheme: https
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/lemonade-api-key
    static_configs:
      - targets: ['snoc-strix.fold-leaffish.ts.net:13305']
        labels:
          server_name: snoc-strix
