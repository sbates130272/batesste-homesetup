# /etc/systemd/system/prometheus-node-exporter.service.d/override.conf
#
# The empty ExecStart= is required, not decorative. systemd treats
# ExecStart as a list for Type=simple units, so a drop-in that adds a
# second entry without first clearing the packaged one fails the unit
# outright at daemon-reload. Clear, then set.
#
# --collector.wifi is off by default upstream. The WiFi (dBm) column
# on the LAN Overview dashboard reads node_wifi_station_signal_dbm,
# which simply does not exist without it -- the scrape stays green and
# the column renders empty, so the failure looks like a dashboard bug
# rather than a missing collector.

[Service]
ExecStart=
ExecStart=/usr/bin/prometheus-node-exporter $ARGS --collector.wifi
