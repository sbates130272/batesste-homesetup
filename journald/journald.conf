# /etc/systemd/journald.conf.d/90-batesste-journald.conf
#
# A drop-in rather than an edit to /etc/systemd/journald.conf, so a
# systemd package upgrade cannot quietly revert it.
#
# Why this exists: on 5 October 2026 the root filesystem reached 88%
# (82 GiB of 98 GiB) and the journal was 3.9 GiB of that -- the
# third-largest consumer on the node, behind only Docker and
# Prometheus. Nothing had gone wrong. journald was doing exactly what
# it is configured to do out of the box, which is to grow to 10% of
# the filesystem it lives on and stop. On a 98 GiB root that ceiling
# is 9.8 GiB, and the only reason it had not been reached yet is that
# the node has not been up long enough.
#
# The 10% default is sized for a filesystem dedicated to /var. On a
# single-LV host where /, /home, /var/lib/docker and the journal all
# share one 98 GiB volume, it is an open-ended claim on space that
# other things need more.

[Journal]

# 1 GiB, which on this node's logging rate is roughly three weeks.
#
# The reason this can be as small as it is: the journal is not the
# system of record here. Alloy reads it with loki.source.journal (see
# ../loki/alloy/config.alloy) and ships every entry to Loki, which
# keeps 90 days on its own 12 GiB LV -- a separate volume, so log
# growth there cannot fill /. The local journal is the buffer in
# front of that pipeline, not the archive behind it.
#
# So the question "how much journal do I need locally" is really
# "how long might Alloy be down before I notice", and the answer is
# bounded by the Grafana alerting that watches it. Three weeks is
# generous against that. Anything older gets read out of Loki.
#
# One caveat worth stating plainly: this is only true for what Alloy
# actually forwards. Entries from before Alloy was deployed, and any
# boot where Alloy failed to start, exist locally and nowhere else --
# vacuuming past them loses them for good.
SystemMaxUse=1G

# Cap individual journal files at 128 MiB so the cap above is
# enforced with reasonable granularity.
#
# journald does not trim; it rotates and then deletes whole files.
# With a single large file it cannot honour SystemMaxUse until that
# file is closed, so the effective ceiling overshoots. 128 MiB gives
# roughly eight files inside the budget, which is also what the
# upstream default (1/8th of SystemMaxUse) would compute here -- set
# explicitly so that changing SystemMaxUse later does not silently
# change rotation behaviour too.
SystemMaxFileSize=128M

# Leave 2 GiB of headroom regardless of the cap above.
#
# The upstream default is 15% of the filesystem, which on 98 GiB is
# 14.7 GiB -- so far above anything the 1 GiB cap could cause that it
# never binds, and would mask a genuine disk emergency rather than
# respond to it. 2 GiB is a real floor: if / ever gets that tight,
# journald stops writing before it becomes the thing that fills the
# last of the disk.
SystemKeepFree=2G
